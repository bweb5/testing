<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PV Repowering Tools</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#0d1329;
    color:white;
}

/* Top bar (UNM style) */
.header{
    background:#BA0C2F;
    padding:18px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.header img{
    height:50px;
}

.header-title{
    font-size:20px;
    font-weight:600;
}

/* Main content */
.container{
    text-align:center;
    padding-top:80px;
}

h1{
    font-size:36px;
    margin-bottom:60px;
}

/* App icons */
.apps{
    display:flex;
    justify-content:center;
    gap:80px;
}

.app{
    text-decoration:none;
    color:white;
    transition: transform .2s ease;
}

.app:hover{
    transform:scale(1.07);
}

.app img{
    width:220px;
}

.label{
    margin-top:14px;
    font-weight:600;
}

</style>

</head>

<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <img src="./images/unm-ece.png">
        <div class="header-title">Electrical & Computer Engineering</div>
    </div>

    <img src="./images/nrel.png">
</div>

<!-- Content -->
<div class="container">

<h1>PV Repowering Tools</h1>

<div class="apps">

<a class="app" href="./cost/">
<img src="./icons/cost.svg">
<div class="label">Cost Model</div>
</a>

<a class="app" href="./warranty/">
<img src="./icons/warranty.svg">
<div class="label">Warranty Model</div>
</a>

</div>

</div>

</body>
</html>
